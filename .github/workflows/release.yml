# 一键出全平台安装包并发布 GitHub Release（2.0 极简分析版）
#
# 2.0 起无浏览器载荷：CI 不再下载 Chromium、不再跑 build-payload.js。
# 构建只需 npm install + 打模块包 + electron-builder。
#
# 触发：打 tag 推送（git tag v2.0.0 && git push origin v2.0.0）→ 自动构建并发布 Release；
#       或在 Actions 页手动 Run workflow（只构建 + 传 artifact，不发布）。

name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  win:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: 安装依赖
        run: npm install --no-audit --no-fund
      - name: 打模块包（ai-analyst）
        run: node scripts/build-modules.js --local
      - name: 构建 Electron 安装包（portable + nsis）
        run: npx electron-builder --win --publish never
      - name: 汇总产物
        shell: bash
        run: |
          mkdir -p out
          cp release/*.exe out/
          ls -la out/
      - uses: actions/upload-artifact@v7
        with:
          name: win
          path: out/*
          if-no-files-found: error

  mac:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: 安装依赖
        run: npm install --no-audit --no-fund
      - name: 打模块包
        run: node scripts/build-modules.js --local
      - name: electron-builder 打包
        run: npx electron-builder --mac zip --${{ matrix.arch }} --publish never -c.directories.output=release-mac
      - name: ad-hoc 签名（Apple Silicon 必需）
        run: |
          set -euo pipefail
          for app in release-mac/mac*/*.app; do
            [ -d "$app" ] || continue
            codesign --force --deep --sign - "$app"
            echo "已签名: $app"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: mac-${{ matrix.arch }}
          path: release-mac/*.zip
          if-no-files-found: error

  server-bundle:
    name: 部署包
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: 打包源码 + 启动脚本
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME#v}"
          [ -n "$VER" ] || VER="dev"
          PKG="tiktok-scraper-server-${VER}"
          rm -rf "/tmp/${PKG}" && mkdir -p "/tmp/${PKG}"
          tar -cf - --exclude='./node_modules' --exclude='./dist' --exclude='./release*' \
                   --exclude='./.git' --exclude='*.tar.gz' . | tar -xf - -C "/tmp/${PKG}"
          cat > "/tmp/${PKG}/start.sh" <<'EOF'
          #!/usr/bin/env bash
          set -e
          cd "$(dirname "$0")"
          [ -d node_modules ] || npm install --no-audit --no-fund
          exec node server.js
          EOF
          chmod +x "/tmp/${PKG}/start.sh"
          tar -czf "${PKG}.tar.gz" -C /tmp "${PKG}"
          ls -la "${PKG}.tar.gz"
      - uses: actions/upload-artifact@v7
        with:
          name: server-bundle
          path: tiktok-scraper-server-*.tar.gz
          if-no-files-found: error

  release:
    name: 发布 Release
    runs-on: ubuntu-latest
    needs: [win, mac, server-bundle]
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: assets
          merge-multiple: true
      - name: 列出资产
        run: ls -la assets/
      - name: 生成 Release 说明（从 CHANGELOG.md 抽取本版段落）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"; VER="${TAG#v}"
          mkdir -p /tmp/rel; NOTES=/tmp/rel/notes.md; : > "$NOTES"
          if [ -f CHANGELOG.md ]; then
            awk -v v="$VER" 'index($0, "## [" v "]") == 1 { f = 1; next } f && /^## / { exit } f { print }' CHANGELOG.md > "$NOTES" || true
          fi
          if [ ! -s "$NOTES" ]; then
            echo "> 本版未在 CHANGELOG.md 中找到 \`## [$VER]\` 条目，按 commit 自动生成。"
            gh api -X POST "repos/${GITHUB_REPOSITORY}/releases/generate-notes" -f tag_name="$TAG" --jq '.body' >> "$NOTES" || true
          fi
          cat "$NOTES"
      - name: 创建 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"; VER="${TAG#v}"
          {
            echo "## 下载"
            echo ""
            echo "| 平台 | 文件 | 说明 |"
            echo "|---|---|---|"
            echo "| Windows | \`TikTokScraper-${VER}-setup.exe\` | 安装版 |"
            echo "| Windows | \`TikTokScraper-${VER}-portable.exe\` | 免安装便携版 |"
            echo "| macOS Apple Silicon | \`TikTokScraper-${VER}-arm64-mac.zip\` | M 系列 |"
            echo "| macOS Intel | \`TikTokScraper-${VER}-x64-mac.zip\` | Intel |"
            echo "| 本地 / 服务器 | \`tiktok-scraper-server-${VER}.tar.gz\` | 源码 + start.sh |"
            echo ""
            echo "**2.0 极简分析版**：无浏览器抓取、无登录、无 Chromium/ffmpeg 载荷，安装包约 100MB。"
            echo "数据来源为本地导入；保留 AI 分析、Excel/CSV 报表、三语界面。"
            echo "首次打开 macOS 版若提示无法验证开发者：右键 → 打开。"
            echo ""
            echo "---"
            echo ""
            echo "## 本版更新"
            echo ""
            cat /tmp/rel/notes.md
          } > /tmp/rel/final.md
          gh release create "$TAG" --repo "${GITHUB_REPOSITORY}" \
            --title "TikTokScraper ${TAG} · 极简分析版" \
            --notes-file /tmp/rel/final.md assets/*
          echo "Release 已发布: ${GITHUB_REPOSITORY}/releases/tag/${TAG}"
