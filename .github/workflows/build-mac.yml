# 在 GitHub 的 macOS 机器上构建 macOS 版（arm64 + x64）
# 2.0 极简分析版：无浏览器载荷 / 无 playwright / 无 ffmpeg，构建更轻更快。
#
# 触发：push 到 master（改动 public/lib/electron/server.js/package.json 时）或手动 Run workflow。
# 产物：该次运行页底部 Artifacts → TikTokScraper-mac-arm64 / -x64

name: build-mac

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'public/**'
      - 'lib/**'
      - 'electron/**'
      - 'server.js'
      - 'package.json'
      - 'scripts/build-mac.sh'
      - '.github/workflows/build-mac.yml'

jobs:
  mac:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: 安装依赖
        run: npm install --no-audit --no-fund

      - name: 图标兜底（build/icon.png 缺失时生成）
        run: |
          if [ ! -f build/icon.png ]; then node scripts/make-icon.js; fi

      - name: 打包模块（ai-analyst）
        run: node scripts/build-modules.js --local

      - name: electron-builder 打包
        run: npx electron-builder --mac zip --${{ matrix.arch }} --publish never -c.directories.output=release-mac

      - name: ad-hoc 签名（Apple Silicon 必需）
        run: |
          set -euo pipefail
          for app in release-mac/mac*/*.app; do
            [ -d "$app" ] || continue
            codesign --force --deep --sign - "$app"
            echo "已签名: $app"
          done

      - name: 上传产物
        uses: actions/upload-artifact@v7
        with:
          name: TikTokScraper-mac-${{ matrix.arch }}
          path: release-mac/*.zip
          if-no-files-found: error
          retention-days: 30
