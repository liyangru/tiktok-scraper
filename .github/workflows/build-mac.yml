# 在 GitHub 的 macOS 机器上构建 macOS 版（arm64 + x64）
#
# 为什么需要 CI：electron-builder 不允许在 Windows 上出 macOS 包，且 Apple Silicon
# 要求 app 至少做 ad-hoc 签名（只能靠 macOS 的 codesign）。所以 mac 包必须在 mac 上构建。
#
# 用法：
#   1. 把本目录（tiktok-scraper/）推到一个 GitHub 仓库
#   2. 打开仓库 Actions 页 → 选 "build-mac" → Run workflow
#   3. 跑完在该次运行页面底部 Artifacts 里下载 TikTokScraper-mac-arm64 / -x64
#
# 说明：
#   - arm64 覆盖所有 Apple Silicon（M 系列，2020 年后绝大多数 Mac）
#   - x64 覆盖 Intel Mac。若你的账号/仓库用不了 macos-15-intel（Intel 机器是较大的
#     runner），删掉 matrix 里 x64 那两行即可，只出 arm64。
#   - 未做 Apple 公证，对方首次打开需「右键 → 打开」。

name: build-mac

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'public/**'
      - 'lib/**'
      - 'electron/**'
      - 'server.js'
      - 'bootstrap.js'
      - 'package.json'
      - '.github/workflows/build-mac.yml'

jobs:
  mac:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: 安装依赖
        run: npm install --no-audit --no-fund

      - name: 准备 macOS 版 Chromium 载荷
        run: |
          set -euo pipefail
          # 用 playwright 的安装器：chromium-1248 / Chrome for Testing 156.0.8078.4，
          # 与 Windows 版实测抓通的那个版本完全一致（patchright 自带的是 1243/Chrome 153）。
          export PLAYWRIGHT_BROWSERS_PATH="$PWD/.mac-browsers"
          npx playwright install chromium
          CHR="$(ls -d "$PLAYWRIGHT_BROWSERS_PATH"/chromium-* | head -1)"
          [ -n "$CHR" ] || { echo "chromium 下载失败"; exit 1; }
          tar -czf browser-payload.tar.gz -C "$PLAYWRIGHT_BROWSERS_PATH" "$(basename "$CHR")"
          echo "载荷: $(du -sh browser-payload.tar.gz | cut -f1)"

      - name: 图标兜底（build/icon.png 缺失时生成）
        run: |
          if [ ! -f build/icon.png ]; then
            PLAYWRIGHT_BROWSERS_PATH="$PWD/.mac-browsers" node scripts/make-icon.js
          fi

      - name: electron-builder 打包
        run: npx electron-builder --mac zip --${{ matrix.arch }} -c.directories.output=release-mac

      - name: ad-hoc 签名（Apple Silicon 必需）
        run: |
          set -euo pipefail
          for app in release-mac/mac*/*.app; do
            [ -d "$app" ] || continue
            codesign --force --deep --sign - "$app"
            echo "已签名: $app"
          done

      - name: 上传产物
        uses: actions/upload-artifact@v7
        with:
          name: TikTokScraper-mac-${{ matrix.arch }}
          path: release-mac/*.zip
          if-no-files-found: error
          retention-days: 30
