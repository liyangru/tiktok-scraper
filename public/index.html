<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>TikTok 数据分析</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preload" href="fonts/geist-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="titlebar" hidden>
  <div class="tb-drag"></div>
  <div class="tb-btns">
    <button type="button" id="tbMin" aria-label="minimize">&#x2013;</button>
    <button type="button" id="tbMax" aria-label="maximize">&#x25A1;</button>
    <button type="button" id="tbClose" aria-label="close">&#x2715;</button>
  </div>
</div>
<div class="wrap">

  <header class="top">
    <div>
      <h1 data-i18n="title">TikTok 数据分析</h1>
      <div class="sub" data-i18n="subtitle"></div>
    </div>
    <div class="tools">
      <span class="chip running" id="runChip" hidden></span>
      <span class="chip" id="browserChip"><span class="dot"></span><span>…</span></span>
      <button type="button" class="settings-btn" id="settingsBtn" data-i18n="settings">设置</button>
      <div class="lang-switch" role="radiogroup" aria-label="Language">
        <button type="button" role="radio" data-lang="zh">中文</button>
        <button type="button" role="radio" data-lang="th">ไทย</button>
        <button type="button" role="radio" data-lang="en">EN</button>
      </div>
    </div>
  </header>

  <div class="grid">
    <!-- ============ 左栏：抓取 / 进度 / 历史 ============ -->
    <div class="col">
      <section class="panel" aria-labelledby="scrapeTitle">
        <h2 class="sec-title" id="scrapeTitle"><span data-i18n="scrapeBox">数据抓取</span></h2>

        <label class="fld">
          <span class="lbl"><span data-i18n="usernames">TikTok 账号</span> <em data-i18n="usernamesHint"></em></span>
          <textarea id="handles" rows="3" spellcheck="false" data-i18n-ph="usernamesPlaceholder"></textarea>
        </label>
        <div class="chips" id="quickAcc" hidden></div>

        <div class="fld" style="margin-bottom:12px">
          <span class="lbl" id="dateLabel" data-i18n="dateRange">日期</span>
        </div>
        <div class="chips" id="presetSeg" role="radiogroup" aria-labelledby="dateLabel"></div>
        <div class="row2" style="margin-bottom:20px">
          <div class="date-field">
            <input type="date" id="from" data-i18n-title="startDate">
            <svg class="df-ic" viewBox="0 0 20 20" aria-hidden="true"><rect x="3" y="4.5" width="14" height="12" rx="2"/><path d="M3 8.5h14M7 3v3M13 3v3"/></svg>
          </div>
          <div class="date-field">
            <input type="date" id="to" data-i18n-title="endDate">
            <svg class="df-ic" viewBox="0 0 20 20" aria-hidden="true"><rect x="3" y="4.5" width="14" height="12" rx="2"/><path d="M3 8.5h14M7 3v3M13 3v3"/></svg>
          </div>
        </div>
        <div class="range-note" id="rangeNote" aria-live="polite"></div>

        <label class="fld">
          <span class="lbl"><span data-i18n="cmpModeLabel">对比</span></span>
          <select id="cmpMode"></select>
        </label>
        <div class="row2" id="cmpCustom" hidden style="margin:-8px 0 20px">
          <div class="date-field">
            <input type="date" id="cmpFrom" data-i18n-title="cmpFromLabel">
            <svg class="df-ic" viewBox="0 0 20 20" aria-hidden="true"><rect x="3" y="4.5" width="14" height="12" rx="2"/><path d="M3 8.5h14M7 3v3M13 3v3"/></svg>
          </div>
          <div class="date-field">
            <input type="date" id="cmpTo" data-i18n-title="cmpToLabel">
            <svg class="df-ic" viewBox="0 0 20 20" aria-hidden="true"><rect x="3" y="4.5" width="14" height="12" rx="2"/><path d="M3 8.5h14M7 3v3M13 3v3"/></svg>
          </div>
        </div>
        <div class="range-note" id="cmpNote" aria-live="polite"></div>

        <div class="stack-btns">
          <button type="button" id="startBtn" class="primary wide" data-i18n="start">开始抓取</button>
          <button type="button" id="stopBtn" class="wide danger" hidden data-i18n="stop">停止</button>
        </div>
      </section>

      <section class="panel" id="taskPanel" aria-live="polite">
        <h2 class="sec-title"><span data-i18n="progress">进度</span><span class="grow"></span><span class="task-time" data-elapsed></span></h2>
        <div id="taskBody"><div class="idle" data-i18n="notStarted"></div></div>
      </section>

      <section class="panel" aria-labelledby="histTitle">
        <h2 class="sec-title" id="histTitle"><span data-i18n="history">历史任务</span><span class="hint" id="historyCount"></span></h2>
        <div class="hist-tools">
          <label><input type="checkbox" id="histAll"> <span data-i18n="histSelectAll"></span></label>
          <span class="grow" id="histMeta"></span>
          <button type="button" id="histDel" class="xs danger" disabled data-i18n="histDelete"></button>
        </div>
        <div id="history"></div>
      </section>
    </div>

    <!-- ============ 右栏：结果 ============ -->
    <div class="col">
      <div class="tip-bubble" id="tipBubble" hidden>
        <span data-i18n="tipLoginBubble"></span>
        <span class="btn-row">
          <button type="button" id="tipLogin" class="xs primary" data-i18n="tipLoginBtn"></button>
          <button type="button" id="tipNever" class="xs ghost" data-i18n="tipNever"></button>
          <button type="button" id="tipClose" class="icon-btn" aria-label="close">×</button>
        </span>
      </div>

      <section class="panel" id="emptyState">
        <div class="empty">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/></svg>
          <b id="emptyTitle" data-i18n="emptyTitle"></b>
          <span id="emptySub" data-i18n="emptySub"></span>
        </div>
      </section>

      <section class="panel" id="results" hidden>
        <h2 class="sec-title"><span data-i18n="overview">结果概览</span></h2>
        <div class="res-head">
          <div class="meta" id="resultMeta"></div>
          <div class="tabs sm" id="acctTabs" role="radiogroup" hidden></div>
          <div class="btn-row">
            <button type="button" id="copyBrief" class="sm" data-i18n="copyBrief">复制简报</button>
            <button type="button" id="exportXlsx" class="sm primary" data-i18n="downloadXlsx">Excel</button>
            <button type="button" id="exportCsv" class="sm" data-i18n="downloadCsv">CSV</button>
          </div>
        </div>

        <div id="dataBanner" hidden></div>
        <div class="kpis" id="kpis"></div>

        <div id="aiSection" hidden></div>
        <div id="chartDaily"></div>
        <div id="chartHours"></div>
        <div id="accountCards"></div>
        <div id="chartCreator" hidden></div>
        <div id="cartSection"></div>
        <div id="periodSection" hidden></div>

        <div class="res-tools">
          <h2 class="sec-title" style="margin:0"><span data-i18n="details">视频明细</span><span class="hint" id="tableMeta"></span></h2>
          <span class="grow"></span>
          <div class="tabs sm" id="periodSeg" role="radiogroup" hidden></div>
          <div class="search-wrap">
            <input class="search" id="search" type="search" data-i18n-ph="searchPh">
            <button type="button" id="searchGo" class="xs primary" hidden data-i18n="searchLinkGo"></button>
            <div class="search-hint" id="searchHint" hidden></div>
          </div>
          <button type="button" id="expandAllBtn" class="sm ghost" data-i18n="expandAll"></button>
          <button type="button" id="dlBatchBtn" class="sm" data-i18n="dlBatch"></button>
          <span class="btn-row" id="pickBar" hidden>
            <span class="muted" id="pickCount" style="font-size:12px"></span>
            <button type="button" id="dlPickCancel" class="sm ghost" data-i18n="dlPickCancel"></button>
            <button type="button" id="dlPickGo" class="sm primary" data-i18n="dlPickGo"></button>
          </span>
        </div>
        <div class="tbl-wrap">
          <table class="videos">
            <thead>
              <tr>
                <th class="ctr pick-col"><input type="checkbox" id="rowSelAll" aria-label="select all"></th>
                <th class="num" style="width:40px">#</th>
                <th class="ctr cover-col"><span data-i18n="colCover"></span></th>
                <th><span data-i18n="colCaption"></span></th>
                <th class="sortable" data-sort="date" style="width:92px"><span data-i18n="colDate"></span><span class="ar"></span></th>
                <th class="num sortable" data-sort="views" style="width:88px"><span data-i18n="colViews"></span><span class="ar"></span></th>
                <th class="num sortable" data-sort="likes" style="width:78px"><span data-i18n="colLikes"></span><span class="ar"></span></th>
                <th class="num sortable" data-sort="comments" style="width:72px"><span data-i18n="colComments"></span><span class="ar"></span></th>
                <th class="num sortable" data-sort="shares" style="width:72px"><span data-i18n="colShares"></span><span class="ar"></span></th>
                <th class="num sortable" data-sort="saves" style="width:72px"><span data-i18n="colSaves"></span><span class="ar"></span></th>
                <th class="num sortable" data-sort="inter" style="width:76px"><span data-i18n="colEngage"></span><span class="ar"></span></th>
                <th class="ctr" style="width:48px"><span data-i18n="colShopping"></span></th>
                <th class="ctr" style="width:44px"><span data-i18n="colDownload"></span></th>
              </tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
      </section>
    </div>
  </div>
  <footer id="appVer" class="app-ver"></footer>
</div>

<div id="toasts" aria-live="polite"></div>

<!-- 设置 -->
<div class="modal-backdrop" id="settingsModal" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
    <div class="modal-head">
      <h2 id="settingsTitle" data-i18n="settingsTitle">设置</h2>
      <button type="button" class="modal-close" data-close aria-label="close">×</button>
    </div>
    <div class="modal-body">
      <section class="set-group">
        <h3><span data-i18n="setLoginGroup">账号登录</span><i class="tip down" tabindex="0" data-i18n-tip="setLoginNote"></i></h3>
        <div class="btn-row">
          <button type="button" class="sm" data-feature="tiktok-login" data-i18n="loginCreator"></button>
          <button type="button" class="sm" data-feature="seller-import" data-i18n="loginSeller"></button>
        </div>
      </section>
      <section class="set-group">
        <h3><span data-i18n="setDataGroup">数据来源</span><i class="tip down" tabindex="0" data-i18n-tip="setDataNote"></i></h3>
        <div class="btn-row">
          <button type="button" class="sm" data-seller-upload data-i18n="sellerManual"></button>
        </div>
      </section>
      <section class="set-group">
        <h3><span data-i18n="setStorageGroup">文件存储位置</span></h3>
        <div class="set-row">
          <button type="button" id="storagePick" class="path"></button>
          <button type="button" id="storageReset" class="sm ghost" data-i18n="storageReset"></button>
          <button type="button" id="storageOpen" class="sm ghost" data-i18n="storageOpen"></button>
        </div>
        <input id="storageDir" class="input" hidden data-i18n-ph="storageInputHint" style="margin-top:8px">
      </section>
      <section class="set-group">
        <h3><span data-i18n="aiGroupTitle">AI</span><i class="tip down" tabindex="0" data-i18n-tip="aiGroupNote"></i><span class="badge" id="aiState"></span></h3>
        <div class="set-grid">
          <input id="aiBase" class="input wide" data-i18n-ph="aiBase">
          <input id="aiKey" class="input" type="password" autocomplete="off" data-i18n-ph="aiKey">
          <input id="aiModel" class="input" data-i18n-ph="aiModel">
          <input id="aiVision" class="input wide" data-i18n-ph="aiVision">
        </div>
        <div class="set-row">
          <button type="button" id="aiSave" class="sm primary" data-i18n="storageSave"></button>
          <button type="button" id="aiTest" class="sm" data-i18n="aiTest"></button>
          <span class="status" id="aiStatus"></span>
        </div>
      </section>
      <section class="set-group">
        <h3><span data-i18n="upGroup">应用更新</span></h3>
        <div class="set-row" style="margin-top:0">
          <button type="button" id="upCheck" class="sm" data-i18n="upCheck"></button>
          <button type="button" id="upInstall" class="sm primary" hidden data-i18n="upInstall"></button>
          <span class="status" id="upState"></span>
        </div>
      </section>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="loginModal" hidden>
  <div class="modal modal-login" role="dialog" aria-modal="true" aria-labelledby="loginTitle">
    <div class="modal-head">
      <h2 id="loginTitle" data-i18n="loginTitle"></h2>
      <button type="button" class="modal-close" data-close aria-label="close">×</button>
    </div>
    <div class="modal-body" id="loginBody"></div>
  </div>
</div>

<div class="modal-backdrop" id="sellerModal" hidden>
  <div class="modal modal-sm" role="dialog" aria-modal="true" aria-labelledby="sellerTitle">
    <div class="modal-head">
      <h2 id="sellerTitle" data-i18n="sellerManual"></h2>
      <button type="button" class="modal-close" data-close aria-label="close">×</button>
    </div>
    <div class="modal-body">
      <span class="muted" style="font-size:12.5px" data-i18n="sellerUpload"></span>
      <input type="file" id="sellerFile" accept=".xlsx,.xls" class="input">
      <div class="status" id="sellerStatus"></div>
    </div>
  </div>
</div>

<script src="i18n.js"></script>
<script src="shared/period.js"></script>
<script src="shared/metrics.js"></script>
<script src="js/core.js"></script>
<script src="js/collapse.js"></script>
<script src="js/charts.js"></script>
<script src="js/filter.js"></script>
<script src="js/progress.js"></script>
<script src="js/results.js"></script>
<script src="js/table.js"></script>
<script src="js/login.js"></script>
<script src="js/settings.js"></script>
<script src="features/creator-login.js"></script>
<script src="features/seller-center.js"></script>
<script src="app.js"></script>
</body>
</html>
